[project]
name = "chat-anonymizer"
version = "0.1.0"
description = "Deterministic PII anonymizer for chat transcripts"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7.0,<4",
]

[project.scripts]
chat-anonymizer = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
